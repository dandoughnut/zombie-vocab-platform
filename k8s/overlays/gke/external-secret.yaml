# Secrets never live in git: External Secrets Operator syncs them from GCP
# Secret Manager into the `zombie-vocab-api-secrets` Secret the pods read.
# The operator authenticates with GKE Workload Identity (no key files).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zombie-vocab-api-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    name: zombie-vocab-api-secrets
  dataFrom:
    # One Secret Manager secret holding the env file as JSON:
    # {"DATABASE_URL": "...", "SUPABASE_URL": "...", ...}
    - extract:
        key: zombie-vocab-api-env
