# Gateway API rather than Ingress: ingress-nginx is retired, and GKE ships a
# managed Gateway controller (an external Application Load Balancer).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zombie-vocab
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zombie-vocab-api
spec:
  parentRefs:
    - name: zombie-vocab
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: zombie-vocab-api
          port: 80
---
# Load balancer health checks use the same DB-free endpoint as the probes.
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: zombie-vocab-api
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /v1/health
  targetRef:
    group: ""
    kind: Service
    name: zombie-vocab-api
