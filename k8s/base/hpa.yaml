apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zombie-vocab-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zombie-vocab-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    # Scale down slowly: evening study spikes come in waves.
    scaleDown:
      stabilizationWindowSeconds: 300
