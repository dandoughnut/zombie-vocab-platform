# The two sweeps that used to be asyncio loops inside every web process
# (app/main.py `_reconcile_loop`, `_event_prune_loop`). With RUN_BACKGROUND_LOOPS
# off, they run here exactly once per schedule.
#
# concurrencyPolicy: Forbid — a slow store API must never lead to two
# reconcile passes re-recording the same subscriptions at once.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zombie-vocab-reconcile
spec:
  schedule: "17 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zombie-vocab-reconcile
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: zombie-vocab-api
              command: ["python", "scripts/reconcile.py"]
              envFrom:
                - configMapRef:
                    name: zombie-vocab-api-config
                - secretRef:
                    name: zombie-vocab-api-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zombie-vocab-prune-events
spec:
  schedule: "41 4 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: zombie-vocab-prune-events
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune-events
              image: zombie-vocab-api
              command: ["python", "scripts/prune_events.py"]
              envFrom:
                - configMapRef:
                    name: zombie-vocab-api-config
                - secretRef:
                    name: zombie-vocab-api-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 256Mi
