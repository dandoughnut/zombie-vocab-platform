# Schema migrations run exactly once per release, before the new pods.
#
# On Railway the start command runs `alembic upgrade head` in the web process,
# which is fine for one instance. With N replicas that becomes N concurrent
# migrators racing on the same schema. Argo CD runs this Job as a PreSync hook
# instead: Sync waits for it, and a failed migration stops the rollout before
# any new pod receives traffic.
apiVersion: batch/v1
kind: Job
metadata:
  name: zombie-vocab-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Retries cover a database that is still starting (fresh kind cluster).
  backoffLimit: 4
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zombie-vocab-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: zombie-vocab-api
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: zombie-vocab-api-config
            - secretRef:
                name: zombie-vocab-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
