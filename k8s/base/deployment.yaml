apiVersion: apps/v1
kind: Deployment
metadata:
  name: zombie-vocab-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: zombie-vocab-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zombie-vocab-api
    spec:
      # Spread replicas across nodes so one node drain/failure never takes
      # every pod at once (pairs with the PodDisruptionBudget).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: zombie-vocab-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: zombie-vocab-api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: zombie-vocab-api-config
            - secretRef:
                name: zombie-vocab-api-secrets
          # /v1/health is DB-free on purpose: a Postgres blip should fail
          # requests, not get every pod restarted by the kubelet at once.
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 15
            failureThreshold: 4
          # Give the Service/Gateway time to stop routing here before uvicorn
          # starts refusing connections on SIGTERM.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
      volumes:
        - name: tmp
          emptyDir: {}
