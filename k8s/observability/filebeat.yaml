# One Filebeat per node (DaemonSet) tailing container logs. Same JSON lifting
# as the Docker Compose stack, scoped to the zombie-vocab namespace so pods,
# Jobs, and CronJob runs all land in one place.
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
spec:
  type: filebeat
  version: 9.5.5
  elasticsearchRef:
    name: logs
  kibanaRef:
    name: logs
  config:
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          templates:
            - condition:
                equals:
                  kubernetes.namespace: zombie-vocab
              config:
                - type: filestream
                  id: container-${data.kubernetes.container.id}
                  paths:
                    - /var/log/containers/*${data.kubernetes.container.id}.log
                  parsers:
                    - container: ~
                  prospector.scanner.symlinks: true
    processors:
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
          add_error_key: true
          expand_keys: true
      - add_host_metadata: ~
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        containers:
          - name: filebeat
            securityContext:
              runAsUser: 0
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 200Mi
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
              - name: varlogpods
                mountPath: /var/log/pods
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
