# Player feedback from Postgres → redaction → a searchable index.
#
# The feedback modal is free text, and people paste their email into it. The
# row in Postgres stays as written (support may need to reply); the copy in
# Elasticsearch, which more people can search, has addresses redacted.
# user_id is never selected: search needs the words, not the person.

input {
  jdbc {
    jdbc_driver_library    => "/usr/share/logstash/drivers/postgresql.jar"
    jdbc_driver_class      => "org.postgresql.Driver"
    jdbc_connection_string => "${FEEDBACK_JDBC_URL}"
    jdbc_user              => "${FEEDBACK_DB_USER}"
    jdbc_password          => "${FEEDBACK_DB_PASSWORD}"
    schedule               => "*/2 * * * *"
    # Incremental: only rows newer than the last run. :sql_last_value persists
    # across restarts in last_run_metadata_path. The SQL lives in its own file
    # (quoting inside a Logstash string is a trap).
    statement_filepath => "/usr/share/logstash/sql/feedback.sql"
    use_column_value       => true
    tracking_column        => "created_at"
    tracking_column_type   => "timestamp"
    last_run_metadata_path => "/usr/share/logstash/data/feedback_last_run"
  }
}

filter {
  mutate {
    gsub => ["message", "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "[email redacted]"]
  }
  # Search by when the feedback was written, not when it was shipped.
  date {
    match  => ["created_iso", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    remove_field => ["@version", "created_iso"]
  }
}

output {
  elasticsearch {
    hosts       => ["${ELASTICSEARCH_URL}"]
    index       => "zombievocab-feedback"
    # The feedback uuid as the document id: a re-poll overwrites instead of
    # duplicating.
    document_id => "%{id}"
  }
}
