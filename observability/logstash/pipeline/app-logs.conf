# API logs from Filebeat → privacy scrubbing → Elasticsearch data stream.
#
# Filebeat has already lifted the app's JSON into fields. Logstash's job is
# what an edge shipper shouldn't own: pseudonymising user ids, dropping noise,
# and routing into a data stream with a retention policy.

input {
  beats {
    port => 5044
  }
}

filter {
  # Kubelet / load balancer probes are ~1 request every 5s per pod: the bulk of
  # the volume and none of the value. Their metrics still reach Prometheus.
  if [http][route] == "/v1/health" {
    drop {}
  }

  # Billing lines carry the account id so support can find "my purchase".
  # Index a keyed hash instead: the same user always gets the same token (so
  # you can still follow one account's deliveries), but the index alone can't
  # be joined back to a person without the key.
  if [billing][user_id] {
    fingerprint {
      source => "[billing][user_id]"
      target => "[billing][user_hash]"
      method => "SHA256"
      key    => "${PSEUDONYM_KEY}"
    }
    mutate {
      remove_field => ["[billing][user_id]"]
    }
  }

  # Shipper bookkeeping nobody queries.
  mutate {
    remove_field => ["[agent][ephemeral_id]", "[agent][id]", "[ecs]", "[log][offset]"]
  }
}

output {
  elasticsearch {
    hosts                 => ["${ELASTICSEARCH_URL}"]
    data_stream           => "true"
    data_stream_type      => "logs"
    data_stream_dataset   => "zombievocab.api"
    data_stream_namespace => "default"
    # Always this stream, whatever routing fields an event happens to carry.
    data_stream_auto_routing => false
  }
}
