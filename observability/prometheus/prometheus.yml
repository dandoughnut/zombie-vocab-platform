# Compose Prometheus. On Kubernetes the Prometheus Operator builds the
# equivalent from the ServiceMonitor in k8s/monitoring.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.generated.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: zombie-vocab-api
    metrics_path: /metrics
    # /metrics is bearer-token gated in the app; same contract as production.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
