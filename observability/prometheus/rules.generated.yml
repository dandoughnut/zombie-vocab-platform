# GENERATED by scripts/render-rules.py from k8s/monitoring/prometheus-rule.yaml. Do not edit.
groups:
- name: zombie-vocab-slo.recording
  interval: 30s
  rules:
  - record: zv:http_error_ratio:rate5m
    expr: sum(rate(zv_http_requests_total{job="zombie-vocab-api",status=~"5.."}[5m])) / sum(rate(zv_http_requests_total{job="zombie-vocab-api"}[5m]))
  - record: zv:http_error_ratio:rate30m
    expr: sum(rate(zv_http_requests_total{job="zombie-vocab-api",status=~"5.."}[30m])) / sum(rate(zv_http_requests_total{job="zombie-vocab-api"}[30m]))
  - record: zv:http_error_ratio:rate1h
    expr: sum(rate(zv_http_requests_total{job="zombie-vocab-api",status=~"5.."}[1h])) / sum(rate(zv_http_requests_total{job="zombie-vocab-api"}[1h]))
  - record: zv:http_error_ratio:rate6h
    expr: sum(rate(zv_http_requests_total{job="zombie-vocab-api",status=~"5.."}[6h])) / sum(rate(zv_http_requests_total{job="zombie-vocab-api"}[6h]))
  - record: zv:http_request_duration_seconds:p95_5m
    expr: histogram_quantile(0.95, sum by (le, route) (rate(zv_http_request_duration_seconds_bucket{job="zombie-vocab-api"}[5m])))
- name: zombie-vocab-slo.alerts
  rules:
  - alert: ZombieVocabErrorBudgetFastBurn
    expr: zv:http_error_ratio:rate1h > (14.4 * 0.005) and zv:http_error_ratio:rate5m > (14.4 * 0.005)
    for: 2m
    labels:
      severity: page
    annotations:
      summary: API is burning its error budget 14x too fast
      description: 5xx ratio is {{ $value | humanizePercentage }} over the last hour (SLO allows 0.5%).
  - alert: ZombieVocabErrorBudgetSlowBurn
    expr: zv:http_error_ratio:rate6h > (6 * 0.005) and zv:http_error_ratio:rate30m > (6 * 0.005)
    for: 15m
    labels:
      severity: ticket
    annotations:
      summary: API is steadily burning its error budget
      description: 5xx ratio is {{ $value | humanizePercentage }} over 6 hours.
- name: zombie-vocab-api.alerts
  rules:
  - alert: ZombieVocabApiDown
    expr: up{job="zombie-vocab-api"} == 0
    for: 2m
    labels:
      severity: page
    annotations:
      summary: API target {{ $labels.instance }} is not answering scrapes
  - alert: ZombieVocabApiAbsent
    expr: absent(up{job="zombie-vocab-api"})
    for: 5m
    labels:
      severity: page
    annotations:
      summary: No API targets exist to scrape
  - alert: ZombieVocabSlowEndpoint
    expr: zv:http_request_duration_seconds:p95_5m{route!~"/v1/webhooks/.*"} > 1
    for: 10m
    labels:
      severity: ticket
    annotations:
      summary: p95 latency of {{ $labels.route }} is {{ $value | humanizeDuration }}
- name: zombie-vocab-billing.alerts
  rules:
  - alert: ZombieVocabBillingWebhooksFailing
    expr: sum by (provider, outcome) (increase(zv_billing_webhooks_total{outcome=~"rejected|unavailable|error"}[15m])) > 3
    labels:
      severity: page
    annotations:
      summary: '{{ $labels.provider }} webhooks: {{ $value | humanize }} {{ $labels.outcome }} in 15m'
      description: Paying users may not be receiving Pro. Check the billing logs by http.request.id in Kibana.
  - alert: ZombieVocabAnalyticsFlood
    expr: sum(increase(zv_analytics_events_total{outcome="flood_dropped"}[1h])) > 0
    labels:
      severity: info
    annotations:
      summary: A client hit the analytics flood limit (events dropped by design)
- name: zombie-vocab-kubernetes.alerts
  rules:
  - alert: ZombieVocabCronJobFailed
    expr: kube_job_status_failed{namespace="zombie-vocab", job_name=~"zombie-vocab-(reconcile|prune-events).*"} > 0
    labels:
      severity: ticket
    annotations:
      summary: Job {{ $labels.job_name }} failed
  - alert: ZombieVocabReconcileStale
    expr: time() - kube_cronjob_status_last_successful_time{namespace="zombie-vocab", cronjob="zombie-vocab-reconcile"} > 26 * 3600
    labels:
      severity: ticket
    annotations:
      summary: Billing reconcile has not succeeded in over 26 hours
  - alert: ZombieVocabPodRestarting
    expr: increase(kube_pod_container_status_restarts_total{namespace="zombie-vocab"}[15m]) > 3
    labels:
      severity: ticket
    annotations:
      summary: '{{ $labels.pod }} restarted {{ $value | humanize }} times in 15m'
