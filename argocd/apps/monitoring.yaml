# kube-prometheus-stack from its Helm chart, with values from this repo
# (multi-source: chart from the chart repo, values from git). Wave 0, so its
# CRDs exist before monitoring-config (wave 1) creates a ServiceMonitor.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.13.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/k8s/monitoring/values.yaml
    - repoURL: https://github.com/dandoughnut/zombie-vocab-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The operator's CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/dandoughnut/zombie-vocab-platform.git
    targetRevision: main
    path: k8s/monitoring
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # ServiceMonitor/PrometheusRule CRDs may still be installing on first sync.
      - SkipDryRunOnMissingResource=true
