# Docker Engine from Docker's own apt repo (Ubuntu's docker.io lags and has
# no compose v2 plugin).
- name: Add Docker's apt repository (deb822, with its signing key)
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: ["{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"]
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Install Docker Engine and the compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Cap container log size so a chatty service can't fill the disk
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "20m", "max-file": "5" }
      }
    mode: "0644"
  notify: Restart docker

- name: Let the deploy user run docker
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true

# Elasticsearch refuses to start in production mode below this.
- name: Raise vm.max_map_count for Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: "262144"
    sysctl_file: /etc/sysctl.d/90-elasticsearch.conf
    state: present
